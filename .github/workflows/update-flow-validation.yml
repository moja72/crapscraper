name: Update Flow Validation

on:
  push:
    branches:
      - fix/canonical-update-download-error-log
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests beautifulsoup4 paramiko playwright Pillow
      - name: Compile all Python modules
        run: python -m py_compile app/*.py
      - name: Check changed JavaScript syntax
        run: |
          node --check app/static/update_technical_log_fix.js
          node --check app/static/update_retry_recovery_v2.js
          node --check app/static/update_flow_final.js
      - name: Run update flow regression tests
        run: |
          python -m pytest -q \
            tests/test_update_flow_finalization.py \
            tests/test_ultrapack_download_diagnostics.py \
            tests/test_update_batch_stability.py \
            tests/test_operational_simple_flow_recovery_policy.py \
            tests/test_update_queue_execution_reliability.py \
            tests/test_update_recoverability_contract.py \
            tests/test_update_retry_safety_policy.py \
            tests/test_update_endpoint_safety.py \
            tests/test_update_persistence.py
