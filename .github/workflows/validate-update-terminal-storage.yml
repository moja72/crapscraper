name: Validate update terminal and storage recovery

on:
  push:
    branches:
      - fix/update-terminal-ui-and-missing-target
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON: python
    defaults:
      run:
        working-directory: CrapScraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest requests beautifulsoup4 openpyxl
      - name: Install Playwright
        run: npm install && npx playwright install chromium
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Check JavaScript syntax
        run: node --check app/static/js/update-terminal-ui.js && node --check app/static/js/update-selection-fix.js && node --check tests/update_progress_ui.mjs && node --check tests/update_execution_ui.mjs
      - name: Run all update Python regressions
        run: python -m pytest -q tests/test_update*.py tests/test_updates.py tests/test_ultrapack_update_session_recovery.py tests/test_runtime_performance_regressions.py
      - name: Run update execution UI regression
        run: node tests/update_execution_ui.mjs
      - name: Run update progress UI regression
        run: node tests/update_progress_ui.mjs
