name: Standardize listing UI

on:
  push:
    branches:
      - feat/padronizar-listagens

permissions:
  contents: write

jobs:
  standardize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/padronizar-listagens

      - name: Standardize pagination, result counters and page sizes
        shell: python
        run: |
          from pathlib import Path
          import re

          web_path = Path('app/web.py')
          js_path = Path('app/static/panel.js')
          css_path = Path('app/static/panel.css')

          web = web_path.read_text(encoding='utf-8')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Não encontrei trecho esperado: {label}')
              return text.replace(old, new, 1)

          # -------------------- HTML / WEB --------------------
          # Terminologia única.
          web = web.replace('Linhas por página', 'Itens por página')

          # Comparação: mesmas opções, mantendo 100 como padrão por ser uma tabela grande.
          web = re.sub(
              r'(<select id=\\"comparison_page_size\\">).*?(</select>)',
              r'\1\n              <option value=\\"10\\">10</option>\n              <option value=\\"25\\">25</option>\n              <option value=\\"50\\">50</option>\n              <option value=\\"100\\" selected>100</option>\n              <option value=\\"250\\">250</option>\n            \2',
              web,
              count=1,
              flags=re.S,
          )

          # Modal Gerenciar Catálogos PluginTema.
          web = re.sub(
              r'(<select id=\\"plugintema_manage_page_size\\">).*?(</select>)',
              r'\1<option value=\\"10\\">10</option><option value=\\"25\\" selected>25</option><option value=\\"50\\">50</option><option value=\\"100\\">100</option><option value=\\"250\\">250</option>\2',
              web,
              count=1,
              flags=re.S,
          )

          # Atualizar > preparação.
          web = re.sub(
              r'(<select id=\\"updates_page_size\\">).*?(</select>)',
              r'\1<option value=\\"10\\">10</option><option value=\\"25\\" selected>25</option><option value=\\"50\\">50</option><option value=\\"100\\">100</option><option value=\\"250\\">250</option>\2',
              web,
              count=1,
              flags=re.S,
          )

          # Atualizar > fila operacional.
          web = re.sub(
              r'(<select id=\\"updates_queue_page_size\\">).*?(</select>)',
              r'\1<option value=\\"10\\">10</option><option value=\\"25\\" selected>25</option><option value=\\"50\\">50</option><option value=\\"100\\">100</option><option value=\\"250\\">250</option>\2',
              web,
              count=1,
              flags=re.S,
          )

          # Catálogos principais: adiciona contador e seletor, que antes eram fixos em 10.
          catalog_pagination = '        <div class=\\"listing-pagination catalogos-pagination\\">'
          catalog_toolbar = '''        <div class=\\"listing-meta-row catalogos-listing-meta\\">
          <div class=\\"small\\" id=\\"catalogos_result_meta\\">Mostrando 0 de 0 itens</div>
          <div class=\\"listing-page-size\\">
            <label for=\\"catalogos_page_size\\" class=\\"small\\">Itens por página</label>
            <select id=\\"catalogos_page_size\\">
              <option value=\\"10\\">10</option><option value=\\"25\\" selected>25</option><option value=\\"50\\">50</option><option value=\\"100\\">100</option><option value=\\"250\\">250</option>
            </select>
          </div>
        </div>

'''
          web = replace_once(web, catalog_pagination, catalog_toolbar + catalog_pagination, 'paginação dos catálogos')

          # Histórico: acrescenta meta + itens por página.
          history_marker = '      <div class=\\"listing-pagination\\"><button class=\\"btn-secondary\\" id=\\"updates_history_prev\\"'
          history_toolbar = '''      <div class=\\"listing-meta-row updates-history-listing-meta\\">
        <div class=\\"small\\" id=\\"updates_history_result_meta\\">Mostrando 0 de 0 itens</div>
        <div class=\\"listing-page-size\\"><label for=\\"updates_history_page_size\\" class=\\"small\\">Itens por página</label><select id=\\"updates_history_page_size\\"><option value=\\"10\\">10</option><option value=\\"25\\" selected>25</option><option value=\\"50\\">50</option><option value=\\"100\\">100</option><option value=\\"250\\">250</option></select></div>
      </div>
'''
          web = replace_once(web, history_marker, history_toolbar + history_marker, 'paginação do histórico')

          # Modal de visualizar lista de atualização: acrescenta meta + itens por página.
          preview_marker = '    <div class=\\"listing-pagination\\"><button class=\\"btn-secondary\\" id=\\"update_list_preview_prev\\"'
          preview_toolbar = '''    <div class=\\"listing-meta-row update-list-preview-listing-meta\\">
      <div class=\\"small\\" id=\\"update_list_preview_result_meta\\">Mostrando 0 de 0 itens</div>
      <div class=\\"listing-page-size\\"><label for=\\"update_list_preview_page_size\\" class=\\"small\\">Itens por página</label><select id=\\"update_list_preview_page_size\\"><option value=\\"10\\">10</option><option value=\\"25\\" selected>25</option><option value=\\"50\\">50</option><option value=\\"100\\">100</option><option value=\\"250\\">250</option></select></div>
    </div>
'''
          web = replace_once(web, preview_marker, preview_toolbar + preview_marker, 'paginação do preview da lista')

          # Setas consistentes em todas as paginações estáticas conhecidas.
          web = web.replace('>Anterior</button><span class=\\"badge\\"', '>← Anterior</button><span class=\\"badge\\"')
          web = web.replace('>Próxima</button>', '>Próxima →</button>')

          # -------------------- JAVASCRIPT --------------------
          anchor = '  const POLL_INTERVAL_MS = Math.max(500, Number(BOOT.poll_interval_ms || 1200));\n'
          helpers = '''  const LISTING_PAGE_SIZE_OPTIONS = [10, 25, 50, 100, 250];
  const LISTING_DEFAULT_PAGE_SIZE = 25;
  const LISTING_LARGE_DEFAULT_PAGE_SIZE = 100;

  function normalizeListingPageSize(value, fallback = LISTING_DEFAULT_PAGE_SIZE) {
    const parsed = toInt(value, fallback);
    return LISTING_PAGE_SIZE_OPTIONS.includes(parsed) ? parsed : fallback;
  }

  function listingRangeText(total, page, pageSize, noun = "itens") {
    const safeTotal = Math.max(0, toInt(total, 0));
    const safeSize = Math.max(1, toInt(pageSize, LISTING_DEFAULT_PAGE_SIZE));
    const safePage = Math.max(1, toInt(page, 1));
    if (!safeTotal) return `Mostrando 0 de 0 ${noun}`;
    const start = ((safePage - 1) * safeSize) + 1;
    const end = Math.min(safePage * safeSize, safeTotal);
    return `Mostrando ${start}–${end} de ${safeTotal} ${noun}`;
  }
'''
          js = replace_once(js, anchor, anchor + '\n' + helpers, 'âncora de helpers de listagem')

          js = js.replace('plugintemaManagePageSize: 100,', 'plugintemaManagePageSize: 25,', 1)
          js = js.replace('pageSize: 50,\n      pageSizeOptions: [25, 50, 100, 250, 500, 1000, 5000, 10000],', 'pageSize: 25,\n      pageSizeOptions: LISTING_PAGE_SIZE_OPTIONS,')
          js = js.replace('pageSize: 50,\n    pageSizeOptions: [25, 50, 100, 250, 500, 1000, 5000, 10000],', 'pageSize: 25,\n    pageSizeOptions: LISTING_PAGE_SIZE_OPTIONS,')
          js = js.replace('pageSize: 50,\n    pageSizeOptions: [25, 50, 100, 250, 500, 1000, 5000, 10000],', 'pageSize: 25,\n    pageSizeOptions: LISTING_PAGE_SIZE_OPTIONS,')
          js = js.replace(': [25, 50, 100, 250, 500, 1000, 5000, 10000];', ': LISTING_PAGE_SIZE_OPTIONS;')
          js = js.replace('const nextSize = toInt(pageSize, 50);', 'const nextSize = normalizeListingPageSize(pageSize, LISTING_DEFAULT_PAGE_SIZE);')
          js = js.replace('UI.catalogPreview.pageSize = allowed.includes(nextSize) ? nextSize : 50;', 'UI.catalogPreview.pageSize = allowed.includes(nextSize) ? nextSize : LISTING_DEFAULT_PAGE_SIZE;')
          js = js.replace('toInt(UI.catalogPreview?.pageSize, 50)', 'toInt(UI.catalogPreview?.pageSize, LISTING_DEFAULT_PAGE_SIZE)')
          js = js.replace('    : 50;', '    : LISTING_DEFAULT_PAGE_SIZE;', 1)

          # Catálogos principais: remove o tamanho fixo e usa o seletor comum.
          js = replace_once(
              js,
              '    const pageSize = 10;\n    const totalPages = Math.max(1, Math.ceil(filteredRows.length / pageSize));',
              '    const pageSize = normalizeListingPageSize(byId("catalogos_page_size")?.value, LISTING_DEFAULT_PAGE_SIZE);\n    UI.catalogPageSize = pageSize;\n    const totalPages = Math.max(1, Math.ceil(filteredRows.length / pageSize));',
              'page size dos catálogos',
          )
          js = replace_once(
              js,
              '    setText("catalogos_page_label", `Página ${UI.catalogPage} de ${totalPages}`);',
              '    setText("catalogos_result_meta", listingRangeText(filteredRows.length, UI.catalogPage, pageSize));\n    setText("catalogos_page_label", `Página ${UI.catalogPage} de ${totalPages}`);',
              'meta dos catálogos',
          )

          # PluginTema manager: mesma política e mesma frase de intervalo.
          js = re.sub(
              r'const requestedPageSize = Number\.parseInt\(byId\("plugintema_manage_page_size"\)\?\.value \|\| UI\.plugintemaManagePageSize, 10\);\s*const pageSize = \[25, 50, 100, 250, 500, 1000, 5000, 10000\]\.includes\(requestedPageSize\) \? requestedPageSize : 100;',
              'const requestedPageSize = byId("plugintema_manage_page_size")?.value || UI.plugintemaManagePageSize;\n  const pageSize = normalizeListingPageSize(requestedPageSize, LISTING_DEFAULT_PAGE_SIZE);',
              js,
              count=1,
          )
          js = re.sub(
              r'byId\("plugintema_manage_range"\)\) byId\("plugintema_manage_range"\)\.textContent = `Mostrando \$\{pageRows\.length\} produto\(s\), de \$\{rangeStart\} até \$\{rangeEnd\}, de \$\{rows\.length\}\.`;',
              'byId("plugintema_manage_range")) byId("plugintema_manage_range").textContent = listingRangeText(rows.length, UI.plugintemaManagePage, pageSize);',
              js,
              count=1,
          )

          # Comparação: contador passa a mostrar o intervalo da página atual.
          js = replace_once(
              js,
              '  setText("comparison_result_meta", `${totalRows} resultado${totalRows === 1 ? "" : "s"} com o filtro atual`, "0 resultados");',
              '  setText("comparison_result_meta", listingRangeText(totalRows, UI.comparison.page, UI.comparison.pageSize, "resultados"), "Mostrando 0 de 0 resultados");',
              'meta da comparação',
          )

          # Atualizar: defaults comuns.
          js = re.sub(
              r'const UPDATE_QUEUE = \{jobs: \[\], filtered: \[\], workingFiltered: \[\], selected: new Set\(\), cancel: false, modalJob: null, page: 1, pageSize: 5, queue: \{status:"stopped",queued:\[\],executing:\[\]\}, queuePage:1, queuePageSize:10, historyMode:"completed", historyPage:1, historyPageSize:10, poll:null, renameQueueName:"", previewQueueName:"", previewItems:\[\], previewMetadata:null, previewPage:1, previewPageSize:15\};',
              'const UPDATE_QUEUE = {jobs: [], filtered: [], workingFiltered: [], selected: new Set(), cancel: false, modalJob: null, page: 1, pageSize: LISTING_DEFAULT_PAGE_SIZE, queue: {status:"stopped",queued:[],executing:[]}, queuePage:1, queuePageSize:LISTING_DEFAULT_PAGE_SIZE, historyMode:"completed", historyPage:1, historyPageSize:LISTING_DEFAULT_PAGE_SIZE, poll:null, renameQueueName:"", previewQueueName:"", previewItems:[], previewMetadata:null, previewPage:1, previewPageSize:LISTING_DEFAULT_PAGE_SIZE};',
              js,
              count=1,
          )
          js = js.replace('UPDATE_QUEUE.pageSize=Number(byId("updates_page_size")?.value||5);', 'UPDATE_QUEUE.pageSize=normalizeListingPageSize(byId("updates_page_size")?.value,LISTING_DEFAULT_PAGE_SIZE);', 1)
          js = js.replace('UPDATE_QUEUE.queuePageSize=Math.max(1,toInt(byId("updates_queue_page_size")?.value,10));', 'UPDATE_QUEUE.queuePageSize=normalizeListingPageSize(byId("updates_queue_page_size")?.value,LISTING_DEFAULT_PAGE_SIZE);', 1)
          js = js.replace('setText("updates_queue_found_count",`${filtered.length} de ${allItems.length} itens`);', 'setText("updates_queue_found_count",listingRangeText(filtered.length,UPDATE_QUEUE.queuePage,UPDATE_QUEUE.queuePageSize));', 1)

          # Preparação: resultado em formato único.
          js = replace_once(
              js,
              'byId("updates_page_label").textContent=`Página ${UPDATE_QUEUE.page} de ${pages}`;',
              'byId("updates_found_count").textContent=listingRangeText(working.length,UPDATE_QUEUE.page,UPDATE_QUEUE.pageSize);byId("updates_page_label").textContent=`Página ${UPDATE_QUEUE.page} de ${pages}`;',
              'meta de preparação',
          )

          # Histórico passa a ler o seletor e exibir intervalo.
          js = replace_once(
              js,
              '  const pages=Math.max(1,Math.ceil(items.length/UPDATE_QUEUE.historyPageSize));',
              '  UPDATE_QUEUE.historyPageSize=normalizeListingPageSize(byId("updates_history_page_size")?.value,LISTING_DEFAULT_PAGE_SIZE);\n  const pages=Math.max(1,Math.ceil(items.length/UPDATE_QUEUE.historyPageSize));',
              'page size do histórico',
          )
          js = replace_once(
              js,
              '  setText("updates_history_page",`Página ${UPDATE_QUEUE.historyPage} de ${pages}`);',
              '  setText("updates_history_result_meta",listingRangeText(items.length,UPDATE_QUEUE.historyPage,UPDATE_QUEUE.historyPageSize));\n  setText("updates_history_page",`Página ${UPDATE_QUEUE.historyPage} de ${pages}`);',
              'meta do histórico',
          )

          # Preview de lista passa a ler o seletor e exibir intervalo.
          js = replace_once(
              js,
              'function renderUpdateListPreview(){const query=normalizeText(byId("update_list_preview_search")?.value).toLowerCase(),all=UPDATE_QUEUE.previewItems||[],items=all.filter(item=>!query||`${item.name} ${item.woo_product_id} ${item.state}`.toLowerCase().includes(query)),pages=Math.max(1,Math.ceil(items.length/UPDATE_QUEUE.previewPageSize));',
              'function renderUpdateListPreview(){const query=normalizeText(byId("update_list_preview_search")?.value).toLowerCase(),all=UPDATE_QUEUE.previewItems||[],items=all.filter(item=>!query||`${item.name} ${item.woo_product_id} ${item.state}`.toLowerCase().includes(query));UPDATE_QUEUE.previewPageSize=normalizeListingPageSize(byId("update_list_preview_page_size")?.value,LISTING_DEFAULT_PAGE_SIZE);const pages=Math.max(1,Math.ceil(items.length/UPDATE_QUEUE.previewPageSize));',
              'page size do preview',
          )
          js = replace_once(
              js,
              'setText("update_list_preview_count",`${items.length} de ${all.length} itens`);setText("update_list_preview_page",`Página ${UPDATE_QUEUE.previewPage} de ${pages}`);',
              'setText("update_list_preview_count",`${items.length} de ${all.length} itens`);setText("update_list_preview_result_meta",listingRangeText(items.length,UPDATE_QUEUE.previewPage,UPDATE_QUEUE.previewPageSize));setText("update_list_preview_page",`Página ${UPDATE_QUEUE.previewPage} de ${pages}`);',
              'meta do preview',
          )

          # Eventos dos novos seletores.
          js = replace_once(
              js,
              '  byId("updates_queue_page_size")?.addEventListener("change",()=>{UPDATE_QUEUE.queuePage=1;renderOperationalQueue();});',
              '  byId("updates_queue_page_size")?.addEventListener("change",()=>{UPDATE_QUEUE.queuePage=1;renderOperationalQueue();});\n  byId("updates_history_page_size")?.addEventListener("change",()=>{UPDATE_QUEUE.historyPage=1;renderUpdateHistory();});\n  byId("update_list_preview_page_size")?.addEventListener("change",()=>{UPDATE_QUEUE.previewPage=1;renderUpdateListPreview();});',
              'eventos de page size em atualizar',
          )

          # Catálogos principais: evento do seletor.
          catalog_event_anchor = '  byId("catalogos_next_page")?.addEventListener("click"'
          idx = js.find(catalog_event_anchor)
          if idx != -1:
              line_end = js.find('\n', idx)
              js = js[:line_end+1] + '  byId("catalogos_page_size")?.addEventListener("change",()=>{UI.catalogPage=1;renderCatalogosTable();});\n' + js[line_end+1:]

          # -------------------- CSS --------------------
          standard_css = r'''

/* ===== Padrão global de listagens: filtros, resultados e paginação ===== */
.listing-meta-row,
.comparison-listing-meta,
.catalogos-listing-meta,
.updates-history-listing-meta,
.update-list-preview-listing-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 12px 0;
}

.listing-page-size {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  flex-wrap: wrap;
}

.listing-page-size label {
  margin: 0;
  color: var(--text-muted);
  white-space: nowrap;
}

.listing-page-size select {
  width: auto;
  min-width: 92px;
  padding: 8px 30px 8px 10px;
}

.listing-pagination {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 14px 0;
}

.listing-pagination .badge {
  min-width: 112px;
  justify-content: center;
  text-align: center;
}

.comparison-filter-grid,
.plugintema-manage-filters,
.updates-list-controls,
.updates-history-filter-group,
.update-list-preview-toolbar {
  gap: 12px;
}

.comparison-filter-grid label,
.plugintema-manage-filters label,
.updates-list-controls label,
.updates-history-filter-group label,
.update-list-preview-toolbar label {
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 700;
}

@media (max-width: 700px) {
  .listing-meta-row,
  .listing-page-size {
    align-items: stretch;
  }

  .listing-meta-row {
    flex-direction: column;
  }

  .listing-page-size {
    width: 100%;
    justify-content: space-between;
  }

  .listing-pagination > button {
    flex: 1 1 120px;
  }
}
'''
          if 'Padrão global de listagens: filtros, resultados e paginação' not in css:
              css += standard_css

          web_path.write_text(web, encoding='utf-8')
          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')

      - name: Validate syntax and expected controls
        shell: bash
        run: |
          python -m py_compile app/web.py
          node --check app/static/panel.js
          grep -q 'catalogos_page_size' app/web.py
          grep -q 'updates_history_page_size' app/web.py
          grep -q 'update_list_preview_page_size' app/web.py
          grep -q 'LISTING_PAGE_SIZE_OPTIONS' app/static/panel.js

      - name: Commit standardized listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web.py app/static/panel.js app/static/panel.css
          git commit -m "ui: padronizar listagens e paginacao"
          git push origin HEAD:feat/padronizar-listagens
