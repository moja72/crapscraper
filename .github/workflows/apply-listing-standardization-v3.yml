name: Apply listing standardization v3

on:
  push:
    branches:
      - feat/padronizar-listagens

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/padronizar-listagens
      - name: Apply changes
        run: python tools/standardize_listings_v3.py
      - name: Validate
        run: |
          python -m py_compile app/web.py
          node --check app/static/panel.js
          grep -q 'catalogos_page_size' app/web.py
          grep -q 'updates_history_page_size' app/web.py
          grep -q 'update_list_preview_page_size' app/web.py
          grep -q 'LISTING_PAGE_SIZE_OPTIONS' app/static/panel.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web.py app/static/panel.js app/static/panel.css
          git commit -m "ui: padronizar listagens e paginacao"
          git push origin HEAD:feat/padronizar-listagens
