name: Retry recovery validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/update-retry-recovery-history-ui]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run recovery contract tests
        run: python -m unittest -v tests.test_update_recoverability_contract
      - name: Check retry JavaScript syntax
        run: node --check app/static/update_retry_recovery_v2.js
