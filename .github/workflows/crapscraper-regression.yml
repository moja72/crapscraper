name: CrapScraper regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: CrapScraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest requests psutil beautifulsoup4

      - name: Python syntax checks
        run: >-
          python -m py_compile
          main.py
          app/current_app_recovery.py
          app/helper_diagnostic.py
          app/missing_target_recovery.py
          app/legacy_permission_recovery.py
          app/update_runtime_consistency.py
          app/update_retry_live_objective.py
          app/addition_runtime_recovery.py
          app/addition_decision_sync.py
          app/addition_execution_recovery.py
          app/comparison_live_reconciliation.py
          app/plugintheme_access_fallback.py
          app/updates/plugintheme_source_recovery.py
          app/updates/ultrapack_source_recovery.py
          app/updates/source_filter_runtime.py
          app/updates/target_preflight.py
          app/additions/source.py
          app/additions/source_filter_runtime.py
          app/additions/source_preflight_runtime.py
          app/additions/woocommerce_bridge_runtime.py
          app/additions/catalog_taxonomy_runtime.py
          app/additions/catalog_content_contract_v3.py
          app/additions/chatgpt_playwright.py
          app/additions/chatgpt_playwright_compat.py
          app/additions/chatgpt_project_url_recovery.py
          app/additions/chatgpt_background_project_runtime.py
          app/additions/chatgpt_background_route_recovery.py
          app/additions/chatgpt_product_isolation_runtime.py
          app/additions/product_content_contract_runtime.py
          app/additions/strict_job_identity_runtime.py
          app/additions/chatgpt_new_job_project_runtime.py
          app/additions/chatgpt_content_response_runtime.py
          app/additions/chatgpt_image_detection_runtime.py
          app/additions/chatgpt_playwright_image.py
          app/additions/chatgpt_playwright_runtime.py
          app/additions/chatgpt_writable_composer_runtime.py
          app/additions/taxonomy_waf_runtime.py
          app/additions/wordpress.py
          app/additions/executor.py
          app/web/server.py
          ../deploy/crapscraper_zip_permission_helper.py

      - name: Targeted Python regressions
        run: >-
          python -m pytest -q
          tests/test_plugintheme_update_source_recovery.py
          tests/test_plugintheme_access_fallback.py
          tests/test_plugintheme_missing_product.py
          tests/test_source_filters_and_runtime_feedback.py
          tests/test_update_sources.py
          tests/test_update_execution_preflight_and_live_version.py
          tests/test_update_target_preflight.py
          tests/test_update_target_casefold.py
          tests/test_update_runtime_consistency.py
          tests/test_retry_error_recovery.py
          tests/test_update_retry_live_objective.py
          tests/test_addition_runtime_recovery.py
          tests/test_addition_execution_recovery.py
          tests/test_addition_media_fallback.py
          tests/test_addition_term_resolution.py
          tests/test_addition_taxonomy_blocked.py
          tests/test_addition_woocommerce_bridge.py
          tests/test_addition_bridge_v2_media_taxonomy_contract.py
          tests/test_addition_final_product_contract.py
          tests/test_addition_chatgpt_playwright.py
          tests/test_addition_product_content_contract.py
          tests/test_addition_catalog_contract_v3.py
          tests/test_addition_strict_job_identity.py
          tests/test_chatgpt_new_job_project_runtime.py
          tests/test_chatgpt_product_isolation_runtime.py
          tests/test_chatgpt_playwright_compat.py
          tests/test_chatgpt_background_route_recovery.py
          tests/test_chatgpt_content_response_runtime.py
          tests/test_chatgpt_rendered_response_and_research.py
          tests/test_chatgpt_image_detection_runtime.py
          tests/test_chatgpt_writable_composer_runtime.py
          tests/test_addition_source_preflight_runtime.py
          tests/test_live_comparison_addition_sync.py

      - name: Current modular app regressions
        run: >-
          python -m pytest -q
          tests/test_current_launcher_contract.py
          tests/test_current_app_recovery.py
          tests/test_helper_diagnostic.py

      - name: Missing-target recovery regressions
        run: python -m pytest -q tests/test_missing_target_recovery.py

      - name: Privileged ZIP helper regressions
        working-directory: .
        run: >-
          python -m pytest -q
          tests/test_zip_helper.py
          tests/test_zip_helper_legacy_owner.py
          tests/test_zip_helper_missing_target.py
          tests/test_zip_helper_legacy_basename.py

      - name: Application bootstrap smoke
        env:
          SCRAPER_DATA_DIR: ${{ runner.temp }}/crapscraper-smoke
          SCRAPER_UPDATE_IMPORT_LEGACY: '0'
          SCRAPER_ADDITION_IMPORT_LEGACY: '0'
        run: python -c "from app.bootstrap import create_application; app=create_application(); print(type(app).__name__)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CrapScraper/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check app/static/js/runtime-fixes.js
          node --check app/static/js/app.js
          node --check app/static/js/add-queue-standardization.js
          node --check app/static/js/add-live-progress.js
          node --check app/static/js/add-stable-polling.js
          node --check app/static/js/catalog-context-updated-at.js
          node --check app/static/js/update-manual-origin.js
          node --check app/static/js/store.js
          node --check app/static/js/update-metrics.js
          node --check tests/compare_loading_ui.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Update UI E2E
        run: npm run e2e:updates

      - name: Store UI E2E
        run: node tests/store_ui.mjs

      - name: Compare loading UI E2E
        run: node tests/compare_loading_ui.mjs