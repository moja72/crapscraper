name: CrapScraper regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: CrapScraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest requests psutil

      - name: Python syntax checks
        run: >-
          python -m py_compile
          app/updates/plugintheme_source_recovery.py
          app/updates/source_filter_runtime.py
          app/additions/source_filter_runtime.py

      - name: Targeted Python regressions
        run: >-
          python -m pytest -q
          tests/test_plugintheme_update_source_recovery.py
          tests/test_source_filters_and_runtime_feedback.py
          tests/test_update_sources.py
          tests/test_update_execution_preflight_and_live_version.py
          tests/test_update_target_preflight.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CrapScraper/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check app/static/js/runtime-fixes.js
          node --check app/static/js/app.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Update UI E2E
        run: npm run e2e:updates

      - name: Compare UI E2E
        run: node tests/compare_ui.mjs
