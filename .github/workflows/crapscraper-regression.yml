name: CrapScraper regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: CrapScraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest requests psutil beautifulsoup4

      - name: Python syntax checks
        run: >-
          python -m py_compile
          main.py
          app/current_app_recovery.py
          app/helper_diagnostic.py
          app/missing_target_recovery.py
          app/updates/plugintheme_source_recovery.py
          app/updates/source_filter_runtime.py
          app/updates/target_preflight.py
          app/additions/source_filter_runtime.py

      - name: Targeted Python regressions
        run: >-
          python -m pytest -q
          tests/test_plugintheme_update_source_recovery.py
          tests/test_source_filters_and_runtime_feedback.py
          tests/test_update_sources.py
          tests/test_update_execution_preflight_and_live_version.py
          tests/test_update_target_preflight.py
          tests/test_update_target_casefold.py

      - name: Current modular app regressions
        run: >-
          python -m pytest -q
          tests/test_current_launcher_contract.py
          tests/test_current_app_recovery.py
          tests/test_helper_diagnostic.py

      - name: Missing-target recovery regressions
        run: python -m pytest -q tests/test_missing_target_recovery.py

      - name: Privileged ZIP helper regressions
        working-directory: .
        run: >-
          python -m pytest -q
          tests/test_zip_helper.py
          tests/test_zip_helper_legacy_owner.py
          tests/test_zip_helper_missing_target.py

      - name: Application bootstrap smoke
        env:
          SCRAPER_DATA_DIR: ${{ runner.temp }}/crapscraper-smoke
          SCRAPER_UPDATE_IMPORT_LEGACY: '0'
          SCRAPER_ADDITION_IMPORT_LEGACY: '0'
        run: python -c "from app.bootstrap import create_application; app=create_application(); print(type(app).__name__)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CrapScraper/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check app/static/js/runtime-fixes.js
          node --check app/static/js/app.js
          node --check app/static/js/catalog-context-updated-at.js
          node --check app/static/js/store.js
          node --check app/static/js/update-metrics.js
          node --check tests/compare_loading_ui.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Update UI E2E
        run: npm run e2e:updates

      - name: Store UI E2E
        run: node tests/store_ui.mjs

      - name: Compare loading UI E2E
        run: node tests/compare_loading_ui.mjs
